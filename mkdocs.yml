site_name: Torch Choice
site_url: https://gsbdbi.github.io/torch-choice/
docs_dir: docs_src
site_dir: docs
nav:
    - Home: index.md
    - Installation: install.md
    - Introduction: intro.md
    - Data Management: data_management.md
    - Easy Data Management and Stata Users: easy_data_management.md
    - Conditional Logit Model: conditional_logit_model_mode_canada.md
    - Nested Logit Model: nested_logit_model_house_cooling.md
    - Additional Examples:
        - Overview: additional_examples.md
        - Yogurt (CPG / brand choice): yogurt.md
        - Cracker (CPG / brand choice): cracker.md
        - Electricity (energy retail SP): electricity.md
        - NOx (pollution-control technology): nox.md
        - Risky Transport (Léon-Miguel VSL): risky_transport.md
        - Brownstone-Train Car (vehicle adoption): brownstone_train_car.md
        - Travel Mode (Greene Ch.19): travel_mode.md
        - LPMC (London Passenger Mode Choice): lpmc.md
        - Japanese FDI (nested logit): japanese_fdi.md
        - Swiss Route Choice (Apollo SP): swiss_route_choice.md
    - Post Estimation: post_estimation_demos.md
    - Coefficient Initialization: coefficient_initialization.md
    - Related Projects: projects.md
    - Compatibility Tests: test.md
    - API Reference Torch-Choice: api_torch_choice.md

# theme: readthedocs
theme:
    name: material
    custom_dir: docs_src/overrides
    icon:
        logo: dalle/dalle

plugins:
    - search
    - mkdocstrings

markdown_extensions:
#   - mdx_math
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
      options:
        custom_icons:
          - docs_src/overrides/.icons
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
#   - https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.5/MathJax.js?config=TeX-AMS_HTML
