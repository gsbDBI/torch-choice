[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-choice"
version = "1.0.7"
description = "A Pytorch Backend Library for Choice Modelling"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Tianyu Du", email = "tianyudu@stanford.edu"},
    {name = "Ayush Kanodia"},
    {name = "Susan Athey"},
]
keywords = ["machine learning", "choice modeling", "pytorch", "econometrics", "discrete choice"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.22,<2.0",
    "termcolor>=1.1.0",
    "scikit-learn",
    "pandas>=1.4.3",
    "tabulate>=0.8.10",
    "torch>=1.12.0",
    "torchvision>=0.13.0",
    "pytorch-lightning>=1.6.3",
    "tensorboard>=2.9.1",
    "nbclient>=0.10.1",
    "seaborn>=0.13.2",
    "scienceplots>=2.1.1",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
    "mypy",
    "pre-commit",
]

# Documentation dependencies
docs = [
    "mkdocs>=1.4.0",
    "mkdocs-material",
    "mkdocs-jupyter",
    "matplotlib",
    "seaborn",
]

# Jupyter notebook dependencies
notebooks = [
    "jupyter>=1.0.0",
    "ipykernel",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
]

# Benchmarking dependencies
benchmarks = [
    "tqdm>=4.64.0",
    "torch-scatter>=2.0.9",
    "torchmetrics>=0.9.2",
]

# Complete set (all optional dependencies)
complete = [
    "torch-choice[dev,docs,notebooks,benchmarks]",
    # Additional packages from requirements_complete.txt
    "absl-py>=1.2.0",
    "aiohttp>=3.8.1",
    "tensorboard>=2.9.1",
    "PyYAML>=6.0",
    "requests>=2.28.1",
    "scipy>=1.8.1",
]

[project.urls]
Homepage = "https://gsbdbi.github.io/torch-choice/"
Documentation = "https://gsbdbi.github.io/torch-choice/"
Repository = "https://github.com/gsbDBI/torch-choice"
"Bug Tracker" = "https://github.com/gsbDBI/torch-choice/issues"

[project.scripts]
# Test runner
torch-choice-test = "ai_generated_tests.run_all_tests:main"

[tool.setuptools.packages.find]
include = ["torch_choice*", "ai_generated_tests"]
exclude = ["tests*", "docs*", "tutorials*", "replication*"]

[tool.setuptools.package-data]
torch_choice = ["py.typed", "**/*.pyi"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["torch_choice"]

[tool.pytest.ini_options]
testpaths = ["tests", "ai_generated_tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.uv.extra-build-dependencies]
torch-scatter = ["torch"]
