# Build the package via `uv build` and upload it to PyPI when a release is published.
# Triggered automatically by `gh release create` (or releasing via the GitHub UI).
#
# Build prerequisites:
# - The release tag commit must have a consistent version in pyproject.toml,
#   setup.py, and torch_choice/__init__.py.
# - PYPI_API_TOKEN must be set as a repository secret.

name: publish-torch-choice-to-pip

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-n-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
